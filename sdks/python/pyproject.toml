[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fluidian"
version = "1.2.0"
description = "Build AI-native interfaces from Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "The Fluidian Authors" }]
keywords = ["ui", "ai", "framework", "server-driven"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/fluidian/fluidian"

[tool.setuptools]
packages = ["fluidian"]
